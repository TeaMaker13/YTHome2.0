<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mój YouTube</title>

<link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Mój YouTube</h1>
     <button id="open-settings" type="button">Ustawienia</button> 
  </header>

  <main>
   <section class="panel">
  <h2>Wyszukaj filmy</h2>

  <form id="search-form">
    <label for="search-query">Czego szukasz?</label>

    <input
      id="search-query"
      type="search"
      placeholder="Np. nauka gry na gitarze"
      required
    >

    <button id="search-button" type="submit">Szukaj</button>
  </form>

  <p id="search-status" role="status"></p>

  <div id="search-results"></div>
</section>
<section class="panel subscriptions-panel">
  <h2>Najnowsze z obserwowanych kanałów</h2>

  <p id="subscriptions-status" role="status">
    Tutaj pojawią się filmy z kanałów zapisanych w ustawieniach.
  </p>

  <div id="subscriptions-results"></div>
</section>
  </main>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <label for="subscribed-channels">
  Obserwowane kanały
</label>

<p id="channels-help">
  Wpisz po jednym kanale w każdym wierszu.
  Możesz podać nazwę z @ albo adres z taką nazwą.
</p>

<textarea
  id="subscribed-channels"
  rows="6"
  placeholder="@NazwaKanalu&#10;https://www.youtube.com/@InnyKanal"
  aria-describedby="channels-help"
  spellcheck="false"
></textarea>
  <h2 id="settings-title">Ustawienia</h2>

  <p>Wpisz swój klucz YouTube Data API v3.</p>

  <label for="api-key">Klucz API</label>
  <input
    id="api-key"
    type="password"
    placeholder="Wklej swój klucz API"
    autocomplete="off"
    spellcheck="false"
  >

  <button id="save-settings" type="button">Zapisz</button>
  <button id="close-settings" type="button">Zamknij</button>
</dialog>
<script src="index.js"></script>
<script src="subscriptions.js"></script>
</body>
</html>
